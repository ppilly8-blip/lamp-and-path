/* Layout: a live sky window on top (sun on an hour ruler, three stations), a quiet ink-on-paper app below. */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface-2: #F3F5F9;
  --ink: #14203A;
  --ink-2: #47536B;
  --ink-3: #5A667E;
  --line: #DAE0E9;
  --line-2: #C3CCDA;
  --focus: #2A5BD7;
  --on-fill: #101A33;

  --morning: #F0A93A;
  --morning-ink: #7B4A00;
  --morning-wash: #FCF0D9;
  --midday: #3F9BDB;
  --midday-ink: #0B5A8C;
  --midday-wash: #DDEEFA;
  --evening: #9391E3;
  --evening-ink: #413F9E;
  --evening-wash: #E8E7FA;

  --hero-ink: #F6F8FF;
  --hero-ink-2: rgba(246, 248, 255, 0.82);
  --hero-line: rgba(246, 248, 255, 0.34);
  --hero-chip: rgba(255, 255, 255, 0.15);
  --ground: rgba(7, 12, 32, 0.58);
  --sky-top: #0E3D80;
  --sky-mid: #3C86C6;
  --sky-bot: #A9D3EE;
  --sky-low: #266AA3;

  --serif: "Literata", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1122;
    --surface: #131B33;
    --surface-2: #1A2441;
    --ink: #E9EDF7;
    --ink-2: #B4BED3;
    --ink-3: #8D99B1;
    --line: #25304E;
    --line-2: #354263;
    --focus: #8FB0FF;
    --morning-ink: #F4C677;
    --morning-wash: #2A2415;
    --midday-ink: #86C8F3;
    --midday-wash: #10283B;
    --evening-ink: #BAB8F7;
    --evening-wash: #1E1F42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1122;
  --surface: #131B33;
  --surface-2: #1A2441;
  --ink: #E9EDF7;
  --ink-2: #B4BED3;
  --ink-3: #8D99B1;
  --line: #25304E;
  --line-2: #354263;
  --focus: #8FB0FF;
  --morning-ink: #F4C677;
  --morning-wash: #2A2415;
  --midday-ink: #86C8F3;
  --midday-wash: #10283B;
  --evening-ink: #BAB8F7;
  --evening-wash: #1E1F42;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--sky-top);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
.i { display: block; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- sky ---------- */
.sky {
  position: relative;
  color: var(--hero-ink);
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 64%, var(--sky-bot) 100%);
  overflow: hidden;
}
.sky--compact { background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 100%); }
.stars { position: absolute; inset: 0; pointer-events: none; opacity: var(--stars, 0); transition: opacity 1.2s; }
.stars i { position: absolute; border-radius: 50%; background: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .stars i { animation: tw 4s ease-in-out infinite alternate; }
  .stars i:nth-child(3n) { animation-duration: 5.5s; animation-delay: -2s; }
  .stars i:nth-child(3n+1) { animation-duration: 3.2s; animation-delay: -1s; }
}
@keyframes tw { from { opacity: 0.35; } to { opacity: 1; } }

.sky-in { position: relative; padding-top: 16px; }
.sky--compact .sky-in { padding-bottom: 22px; }
.sky-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 12.5px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px;
  background: var(--hero-chip);
  font: 600 12.5px/1 var(--sans);
  white-space: nowrap;
}
.eyebrow { margin: 24px 0 6px; font: 600 12px/1.2 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--hero-ink-2); }
.sky--compact .eyebrow { margin-top: 20px; }
.h-ref { margin: 0; font: 600 clamp(40px, 12vw, 58px)/1.02 var(--serif); letter-spacing: -0.02em; text-wrap: balance; }
.sky--compact .h-ref { font-size: clamp(30px, 8vw, 38px); }
.h-gist { margin: 12px 0 0; max-width: 44ch; font: 400 16px/1.5 var(--serif); color: var(--hero-ink-2); text-wrap: pretty; }
.back {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
  padding: 8px 12px; border: 1px solid var(--hero-line); border-radius: 999px;
  background: transparent; color: var(--hero-ink); font: 600 13px/1 var(--sans);
}

.ta {

.banner {

.snack[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- installable build only ---------- */
html { overscroll-behavior-y: none; }
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }

.pw { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.pw-i { padding: 16px 18px; display: grid; gap: 12px; }

function renderFinished(act) {

    '<div class="empty"><b>What comes next?</b>Acts is a good next book, then Proverbs or Genesis 1–11. You can also read Luke, or begin the plan again with a fresh round.' +

function renderToday() {
  const cur = currentDay(), act = activity();
  if (cur > N && !ui.viewDay) return renderFinished(act);
  const day = viewDay(), d = PLAN[day - 1];
  let h = "";
  if (day > cur) return previewCard(d, cur) + weekStrip(act);
  const nd = day === cur ? nudge(act) : "";
  if (nd) h += '<div class="nudge">' + nd + "</div>";
  if (day === cur && hooks.today) h += hooks.today();
  if (day === cur && dayComplete(day)) h += doneStrip(day);
  h += MOMENTS.map((m) => momentCard(m, day)).join("");
  return h + weekStrip(act);
}

/* ---------- plan ---------- */
function renderPlan() {
  const cur = currentDay(), n = readCount();
  const groups = [
    { from: 1, to: 4, t: "Weeks 1–4", s: "Mark, with a Psalm to close each week" },
    { from: 5, to: 7, t: "Weeks 5–7", s: "Philippians, James and 1 John, with a look-back day to close" },
    { from: 8, to: 12, t: "Weeks 8–12", s: "John, then four closing Psalms" }
  ];
  let h = '<div class="prog"><div class="prog-t">' + n + " of " + N + " read<span>" + (st.round > 1 ? "Round " + st.round + " · " : "") + (st.startedOn ? "Started " + esc(fmtDate(st.startedOn)) : "Not started yet") + '</span></div><div class="bar"><i style="width:' + ((n / N) * 100).toFixed(1) + '%"></i></div></div>';
  groups.forEach((g) => {
    h += '<div class="grp"><h3>' + g.t + "</h3><p>" + g.s + "</p></div>";
    for (let w = g.from; w <= g.to; w++) {
      h += '<div class="wk"><span class="wk-l">Wk ' + w + "</span>";
      for (let i = 0; i < 5; i++) {
        const d = PLAN[(w - 1) * 5 + i], done = !!doneOf(d.day).r, today = d.day === cur;
        h += '<button class="pc' + (done ? " pc--done" : "") + (today ? " pc--today" : "") + (d.day > cur && !done ? " pc--ahead" : "") + '" data-act="open-day" data-day="' + d.day + '" aria-label="Day ' + d.day + ", " + esc(d.label) + (done ? ", read" : today ? ", today" : "") + '">' +
          esc(d.short) + (done ? '<span class="pk">' + ic("check", 11, 3) + "</span>" : "") + "</button>";
      }
      h += "</div>";
    }
  });
  return h + '<p class="plan-end"><b>After Day ' + N + ':</b> Acts, then Proverbs or Genesis 1–11, or repeat with Luke.</p>';
}

/* ---------- notes ---------- */
function renderNotes() {
  const kept = [], ents = [];
  Object.keys(st.notes).forEach((k) => {
    const p = parseKey(k), n = st.notes[k], d = PLAN[p.day - 1];
    if (!d) return;
    const dn = st.done[k] || {};
    if (n.star) kept.push({ p: p, d: d });
    if (n.line || n.prayer) ents.push({ p: p, d: d, n: n, date: dn.m || dn.e || dn.r || "" });
  });
  const ord = (a, b) => b.p.round - a.p.round || b.p.day - a.p.day;
  kept.sort(ord); ents.sort(ord);
  let h = "";
  h += '<div class="sec-h" style="margin-top:4px"><h2>Verses I’m keeping</h2><span>' + kept.length + "</span></div>";
  h += kept.length ? kept.map((x) => '<div class="keep">' + verseFig(x.d.vs, x.d.ref, "verse--sm") + "</div>").join("")
    : '<div class="empty"><b>Nothing kept yet</b>Tap the star under a morning verse to keep it here.</div>';
  h += '<div class="sec-h"><h2>Reflections and prayers</h2><span>' + ents.length + "</span></div>";
  h += ents.length ? '<div class="list">' + ents.map((x) => {
    const inner = '<div class="ent-h"><b>Day ' + x.p.day + " · " + esc(x.d.label) + (x.p.round > 1 ? " (round " + x.p.round + ")" : "") + "</b><span>" + esc(x.date ? fmtDate(x.date) : "") + "</span></div>" +
      (x.n.line ? "<p><small>Midday</small>" + esc(x.n.line) + "</p>" : "") + (x.n.prayer ? "<p><small>Evening prayer</small>" + esc(x.n.prayer) + "</p>" : "");
    return x.p.round === st.round ? '<button class="ent" data-act="open-day" data-day="' + x.p.day + '">' + inner + "</button>" : '<div class="ent">' + inner + "</div>";
  }).join("") + "</div>"
    : '<div class="empty"><b>Your lines will collect here</b>Finish a midday reflection or an evening prayer and it will appear in this list.</div>';
  if (ui.canDownload && (kept.length || ents.length)) h += '<div class="row" style="justify-content:center;margin-top:22px"><button class="btn btn--ghost btn--sm" data-act="export">' + ic("dl", 18) + " Save notes as a file</button></div>";
  return h;
}
function notesMarkdown() {
  const L = ["# Lamp & Path notes", ""], rows = [];
  Object.keys(st.notes).forEach((k) => { const p = parseKey(k); if (PLAN[p.day - 1]) rows.push({ k: k, p: p }); });
  rows.sort((a, b) => a.p.round - b.p.round || a.p.day - b.p.day);
  const kept = rows.filter((r) => st.notes[r.k].star);
  if (kept.length) {
    L.push("## Verses I'm keeping", "");
    kept.forEach((r) => { const d = PLAN[r.p.day - 1]; L.push("> " + d.vs.map((v) => v.t).join(" "), "> — " + d.ref + " (KJV)", ""); });
  }
  const ents = rows.filter((r) => st.notes[r.k].line || st.notes[r.k].prayer);
  if (ents.length) L.push("## Reflections and prayers", "");
  ents.forEach((r) => {
    const n = st.notes[r.k], dn = st.done[r.k] || {}, d = PLAN[r.p.day - 1], date = dn.m || dn.e || dn.r || "";
    L.push("### Day " + r.p.day + " · " + d.label + (r.p.round > 1 ? " (round " + r.p.round + ")" : "") + (date ? " · " + date : ""), "");
    if (n.line) L.push("**Midday:** " + n.line, "");
    if (n.prayer) L.push("**Evening prayer:** " + n.prayer, "");
    if (n.acted) L.push("Small action: done", "");
  });
  return L.join("\n");
}

function liveUpdate() {

/* ================= installable build =================
   Runs inside the same closure as the app, after the views and before the behaviour.
   Adds: a stand-in for the host's file-save call, offline support, an install nudge,
   backup and restore, and safety for half-written reflections. */
const PWA = { prompt: null, offline: false, restore: null };
const LS_DRAFTS = "lamp-and-path:drafts";
const LS_BACKUP = "lamp-and-path:lastBackup";
const LS_SNOOZE = "lamp-and-path:backupSnooze";
const LS_INSTALL = "lamp-and-path:installNudge";
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* unavailable */ } };
const isStandalone = () => {
  try {
    return ["standalone", "fullscreen", "minimal-ui"].some((m) => window.matchMedia("(display-mode: " + m + ")").matches) || window.navigator.standalone === true;
  } catch (e) { return false; }
};
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");
const daysSince = (s) => (s && /^\d{4}-\d{2}-\d{2}$/.test(s) ? Math.round((parseYmd(ymd(now())) - parseYmd(s)) / 864e5) : Infinity);
function refreshUi() {
  if (ui.tab === "reminders" || (ui.tab === "today" && !ui.viewDay && (window.scrollY || 0) < 40)) renderGuarded();
}

/* ---------- saving a file ---------- */
function saveFile(name, text) {
  const type = /\.json$/i.test(name) ? "application/json" : "text/markdown";
  const blob = new Blob([text], { type: type + ";charset=utf-8" });
  try {
    const file = new File([blob], name, { type: blob.type });
    if (isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: name }).catch((e) => {
        if (e && e.name === "AbortError") { const d = new Error("declined"); d.code = "declined"; throw d; }
        throw e;
      });
    }
  } catch (e) { /* fall through to an ordinary download */ }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener"; a.hidden = true;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  return Promise.resolve();
}
if (!window.claude) {
  /* A small stand-in for the host's object, so "Save notes as a file" is an ordinary download here. */
  window.claude = { use: async (name) => (name === "downloads" ? { save: (o) => saveFile(o.filename, o.data) } : null) };
}

/* ---------- backup and restore ---------- */
function summarize(s) {
  let read = 0, entries = 0, kept = 0;
  for (const k in s.done) if (s.done[k] && s.done[k].r) read++;
  for (const k in s.notes) { const n = s.notes[k] || {}; if (n.line || n.prayer) entries++; if (n.star) kept++; }
  return { read: read, entries: entries, kept: kept };
}
function sanitize(s) {
  const date = /^\d{4}-\d{2}-\d{2}$/, keyOk = /^(\d+|\d+_\d+)$/;
  Object.keys(s.done).forEach((k) => {
    const x = s.done[k];
    if (!isObj(x) || !keyOk.test(k)) { delete s.done[k]; return; }
    ["r", "m", "e"].forEach((id) => { if (!(typeof x[id] === "string" && date.test(x[id]))) delete x[id]; });
  });
  Object.keys(s.notes).forEach((k) => {
    const x = s.notes[k];
    if (!isObj(x) || !keyOk.test(k)) { delete s.notes[k]; return; }
    ["line", "prayer"].forEach((f) => { if (typeof x[f] !== "string") delete x[f]; else x[f] = x[f].slice(0, 1000); });
    ["acted", "star"].forEach((f) => { if (typeof x[f] !== "boolean") delete x[f]; });
  });
  if (s.startedOn && !date.test(s.startedOn)) s.startedOn = "";
  return s;
}
async function doBackup() {
  const name = "lamp-and-path-backup-" + ymd(now()) + ".json";
  const text = JSON.stringify({ app: "lamp-and-path", format: 1, saved: new Date().toISOString(), state: st }, null, 2);
  try {
    const dl = await window.claude.use("downloads");
    await dl.save({ filename: name, data: text });
    lsSet(LS_BACKUP, ymd(now()));
    snack("Backup saved");
    if (ui.tab === "reminders") renderGuarded();
  } catch (e) {
    if (!e || e.code !== "declined") snack("Couldn’t save the backup");
  }
}
function readBackup(file) {
  if (!file) return;
  if (file.size > 5e6) { snack("That file is too large to be a backup"); return; }
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(String(rd.result));
      if (!j || j.app !== "lamp-and-path" || !isObj(j.state)) throw new Error("not a backup");
      const next = sanitize(normalize(j.state));
      PWA.restore = { state: next, name: file.name, sum: summarize(next) };
      renderGuarded();
    } catch (e) { snack("That file isn’t a Lamp & Path backup"); }
  };
  rd.onerror = () => snack("Couldn’t read that file");
  rd.readAsText(file);
}
function applyRestore() {
  const r = PWA.restore;
  if (!r || !r.state) return;
  PWA.restore = null;
  st = r.state;
  st.updatedAt = Date.now();
  saveLocal();
  ui.viewDay = null; ui.open = undefined; ui.drafts = {}; ui.tab = "today";
  saveDrafts();
  render(); toTop();
  snack("Backup restored");
}

/* ---------- install ---------- */
async function doInstall() {
  const p = PWA.prompt;
  if (!p) return;
  PWA.prompt = null; /* an install prompt can be used once */
  try {
    p.prompt();
    const r = await p.userChoice;
    if (r && r.outcome === "dismissed") lsSet(LS_INSTALL, "no");
  } catch (e) { /* none */ }
  refreshUi();
}
function persist() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { /* none */ }); } catch (e) { /* none */ }
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); PWA.prompt = e; refreshUi(); });
window.addEventListener("appinstalled", () => { PWA.prompt = null; lsSet(LS_INSTALL, "no"); persist(); refreshUi(); snack("Installed. Find it on your home screen."); });

/* ---------- offline ---------- */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    /* Offline, the saved copy is already in charge; asking again would only log a failed update check. */
    (navigator.onLine === false ? Promise.resolve() : navigator.serviceWorker.register("sw.js"))
      .then(() => navigator.serviceWorker.ready)
      .then(() => { PWA.offline = true; refreshUi(); })
      .catch(() => { /* the app still works online without it */ });
  });
}

/* ---------- reflections survive the app being closed ---------- */
let draftTimer = 0;
function saveDrafts() { clearTimeout(draftTimer); lsSet(LS_DRAFTS, JSON.stringify(ui.drafts)); }
document.addEventListener("input", () => { clearTimeout(draftTimer); draftTimer = setTimeout(saveDrafts, 300); });
document.addEventListener("click", () => { setTimeout(saveDrafts, 0); }); /* after "Save and finish" clears a draft */
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDrafts(); });
window.addEventListener("pagehide", saveDrafts);

}

    '<div class="pw-i"><div><span class="rr-n">Back up your progress</span><p>Your progress and notes are saved on this device only. Save a backup file now and then. It is also how you move to a new phone.</p></div>' +
    '<div class="pw-act"><button class="btn btn--ink btn--sm" data-pwa="backup">' + ic("dl", 18) + 'Back up now</button><button class="btn btn--sm btn--ghost" data-pwa="restore">Restore from backup</button></div>' +
    '<input type="file" id="pwa-file" accept="application/json,.json" hidden><p class="pw-sub">' + (daysSince(last) < Infinity ? "Last backup: " + esc(fmtDate(last, true)) : "No backup yet") + "</p>" + confirm + "</div></div>";
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-pwa]");
  if (!el) return;
  const a = el.dataset.pwa;
  if (a === "install") doInstall();
  else if (a === "install-no") { lsSet(LS_INSTALL, "no"); render(); }
  else if (a === "backup") doBackup();
  else if (a === "backup-later") { lsSet(LS_SNOOZE, ymd(addDays(now(), 14))); render(); }
  else if (a === "restore") { const f = $("#pwa-file"); if (f) f.click(); }
  else if (a === "restore-yes") applyRestore();
  else if (a === "restore-no") { PWA.restore = null; render(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t && t.id === "pwa-file") { const f = t.files && t.files[0]; t.value = ""; readBackup(f); }
});

/* ================= behaviour ================= */
const reduceMotion = (() => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();
function snack(msg) {
  const el = $("#snack");
  el.textContent = msg; el.hidden = false;
  clearTimeout(snack.t);
  snack.t = setTimeout(() => { el.hidden = true; }, 2200);
}
function setOpen(card, open) {
  card.dataset.open = String(open);
  const p = card.querySelector(".mc-p"), b = card.querySelector(".mc-h");
  if (p) p.hidden = !open;
  if (b) b.setAttribute("aria-expanded", String(open));
}
function openMoment(id, scroll) {
  const card = $("#mc-" + id);
  if (!card) return;
  document.querySelectorAll(".mc[data-m]").forEach((c) => setOpen(c, c === card));
  ui.open = id;
  if (scroll) {
    card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    const h = card.querySelector(".mc-h");
    if (h) h.focus({ preventScroll: true });
  }
}
const toTop = () => { try { window.scrollTo(0, 0); } catch (e) { /* none */ } };

/* ---------- audio chime (only after a tap, never by surprise) ---------- */
let ac = null;
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = ac || new AC();
    if (ac.state === "suspended") ac.resume();
  } catch (e) { /* none */ }
}
function chime(force) {
  if ((!st.chime && !force) || !ac || ac.state !== "running") return;
  try {
    const t0 = ac.currentTime;
    [[659.25, 0], [987.77, 0.2]].forEach((n) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t0 + n[1]);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + n[1] + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + 1.1);
      o.connect(g); g.connect(ac.destination);
      o.start(t0 + n[1]); o.stop(t0 + n[1] + 1.2);
    });
  } catch (e) { /* none */ }
}

/* ---------- reminders while the page is open ---------- */
const FIRED_KEY = "lamp-and-path:fired";
let fired = {};
try { fired = JSON.parse(sessionStorage.getItem(FIRED_KEY) || "{}") || {}; } catch (e) { fired = {}; }
function markFired(k) { fired[k] = 1; try { sessionStorage.setItem(FIRED_KEY, JSON.stringify(fired)); } catch (e) { /* none */ } }
function checkReminders() {
  const cur = currentDay();
  if (cur > N) return;
  const t = ymd(now()), n = nowMin();
  for (let i = 0; i < MOMENTS.length; i++) {
    const m = MOMENTS[i], c = st.rem[m.id];
    if (!c.on) continue;
    const s = minsOf(c.t), k = t + ":" + m.id;
    if (n >= s && n < s + 90 && !fired[k] && !doneOf(cur)[m.id]) {
      markFired(k); ui.banner = m.id; renderBanner(); chime();
      return;
    }
  }
}
/* Opening the page inside a moment's window needs no banner: the card already says "Now". */
function seedFired() {
  const t = ymd(now()), n = nowMin();
  MOMENTS.forEach((m) => {
    const s = minsOf(st.rem[m.id].t);
    if (n >= s && n < s + 90) fired[t + ":" + m.id] = 1;
  });
}
function tick() {
  liveUpdate();
  const sig = sigStatus() + ":" + currentDay();
  if (sig !== ui.sig) { ui.sig = sig; renderGuarded(); }
  checkReminders();
}

/* ---------- actions ---------- */
const A = {
  nav(el) {
    const t = el.dataset.tab;
    if (t === "today") { ui.viewDay = null; ui.open = undefined; }
    ui.tab = t; render(); toTop();
  },
  "goto-tab"(el) { ui.tab = el.dataset.tab; render(); toTop(); },
  toggle(el) {
    const id = el.dataset.m, card = $("#mc-" + id);
    if (!card) return;
    const willOpen = card.dataset.open !== "true";
    document.querySelectorAll(".mc[data-m]").forEach((c) => setOpen(c, false));
    if (willOpen) setOpen(card, true);
    ui.open = willOpen ? id : null;
  },
  "goto-moment"(el) { openMoment(el.dataset.m, true); },
  complete(el) {
    const id = el.dataset.m, day = viewDay(), k = key(day), t = ymd(now());
    if (day > currentDay()) return;
    const patch = { done: {}, notes: {} };
    patch.done[k] = {}; patch.done[k][id] = t;
    patch.notes[k] = {};
    if (!st.startedOn) patch.startedOn = t;
    if (id === "m") {
      const ta = $("#ta-line");
      patch.notes[k].line = ta ? ta.value.trim() : "";
      delete ui.drafts[draftKey(day, "m")];
    } else if (id === "e") {
      const ta = $("#ta-prayer"), cb = $("#cb-act");
      patch.notes[k].prayer = ta ? ta.value.trim() : "";
      patch.notes[k].acted = !!(cb && cb.checked);
      delete ui.drafts[draftKey(day, "e")];
    } else delete patch.notes;
    commit(patch);
    ui.open = id;
    render();
    snack(dayComplete(day) ? "Day " + day + " complete" : id === "r" ? "Marked as read" : id === "m" ? "Reflection saved" : "Prayer saved");
  },
  undo(el) {
    const id = el.dataset.m, day = viewDay(), k = key(day), patch = { done: {} };
    patch.done[k] = {}; patch.done[k][id] = "";
    commit(patch); ui.open = id; render();
  },
  star(el) {
    const day = viewDay(), k = key(day), next = !noteOf(day).star, patch = { notes: {} };
    patch.notes[k] = { star: next };
    commit(patch);
    el.setAttribute("aria-pressed", String(next));
    el.setAttribute("aria-label", next ? "Remove this verse from Notes" : "Keep this verse in Notes");
    snack(next ? "Kept in Notes" : "Removed from Notes");
  },
  "open-day"(el) { ui.viewDay = +el.dataset.day; ui.open = undefined; ui.tab = "today"; render(); toTop(); },
  "back-today"() { ui.viewDay = null; ui.open = undefined; render(); toTop(); },
  "rem-toggle"(el) {
    const id = el.dataset.m, patch = { rem: {} };
    patch.rem[id] = { on: !st.rem[id].on };
    commit(patch);
    el.setAttribute("aria-checked", String(st.rem[id].on));
    liveUpdate();
  },
  "chime-toggle"(el) {
    const on = !st.chime;
    commit({ chime: on });
    el.setAttribute("aria-checked", String(on));
    if (on) { unlockAudio(); setTimeout(() => chime(true), 80); }
  },
  async export() {
    try {
      const dl = await window.claude.use("downloads");
      if (!dl) return;
      await dl.save({ filename: "lamp-and-path-notes.md", data: notesMarkdown() });
      snack("Notes saved");
    } catch (e) {
      if (!e || e.code !== "declined") snack("Couldn’t save the file");
    }
  },
  "new-round"() { ui.confirmRound = true; render(); },
  "new-round-no"() { ui.confirmRound = false; render(); },
  "new-round-yes"() { ui.confirmRound = false; commit({ round: st.round + 1 }); ui.viewDay = null; ui.open = undefined; render(); toTop(); },
  "banner-open"(el) {
    const id = el.dataset.m;
    ui.banner = null; ui.tab = "today"; ui.viewDay = null; ui.open = id;
    render(); toTop();
    const card = $("#mc-" + id);
    if (card) card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  },
  "banner-close"() { ui.banner = null; renderBanner(); }
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t && t.dataset && t.dataset.draft) ui.drafts[draftKey(viewDay(), t.dataset.draft)] = t.value;
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (!t) return;
  if (t.id === "cb-act") {
    const day = viewDay(), patch = { notes: {} };
    patch.notes[key(day)] = { acted: !!t.checked };
    commit(patch);
  } else if (t.classList && t.classList.contains("tm")) {
    if (!/^\d{2}:\d{2}$/.test(t.value)) return;
    const id = t.dataset.m, patch = { rem: {} };
    patch.rem[id] = { t: t.value };
    commit(patch);
    const a = t.closest(".rr").querySelector("a.cal");
    if (a) a.setAttribute("href", gcal(MBY[id]));
    liveUpdate();
  }
});
document.addEventListener("focusout", () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (needsRender && !(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) render();
  }, 80);
});
document.addEventListener("pointerdown", () => { if (st.chime) unlockAudio(); }, { passive: true });

/* ---------- boot ---------- */
async function initDownloads() {
  try {
    const C = window.claude;
    if (!C || typeof C.use !== "function") return;
    const dl = await C.use("downloads");
    ui.canDownload = !!dl;
    if (ui.canDownload && ui.tab === "notes") renderGuarded();
  } catch (e) { ui.canDownload = false; }
}
(function boot() {
  const local = loadLocal();
  if (local) st = local;
  if (hooks.boot) hooks.boot();
  render();
  initDb();
  initDownloads();
  setInterval(tick, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  seedFired();
})();

})();
</script>
</body>
</html>
